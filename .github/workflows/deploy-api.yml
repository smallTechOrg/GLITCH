# Test, build and deploy the API to Cloud Run (spec/architecture.md → Deploy).
# Auth is keyless: GitHub's OIDC token is exchanged through Workload Identity Federation
# for the glitch-deployer service account (push to Artifact Registry `glitch`, deploy the
# `glitch-api` service only). None of the values below are secrets.
# `--image` deploys keep the service's env vars, secret mounts and runtime service account;
# change those with `gcloud run services update` (README → Deploy).
name: Deploy API to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  PROJECT_ID: ai-agent-boilerplate0
  REGION: us-central1
  SERVICE: glitch-api
  IMAGE: us-central1-docker.pkg.dev/ai-agent-boilerplate0/glitch/glitch-api
  WIF_PROVIDER: projects/870371939888/locations/global/workloadIdentityPools/github/providers/glitch-github
  DEPLOYER_SA: glitch-deployer@ai-agent-boilerplate0.iam.gserviceaccount.com

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install
        run: uv sync --frozen

      - name: Tests (live + gcs markers are deselected by default)
        run: uv run pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push the image
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "${IMAGE}:${GITHUB_SHA}" api
          docker push "${IMAGE}:${GITHUB_SHA}"

      - name: Deploy
        run: gcloud run deploy "$SERVICE" --image "${IMAGE}:${GITHUB_SHA}" --project "$PROJECT_ID" --region "$REGION" --quiet

      - name: Smoke (/health, not /healthz — Cloud Run reserves it)
        run: |
          URL=$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format 'value(status.url)')
          for i in 1 2 3 4 5; do curl -sf "$URL/health" > health.json && break || sleep 3; done
          cat health.json
          grep -q '"provider":"openrouter"' health.json
